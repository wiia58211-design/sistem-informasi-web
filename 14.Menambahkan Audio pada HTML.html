<!DOCTYPE html>
<html>
<head>
    <title>Menambahkan Audio HTML</title>
</head>
<body>

    <h1>Belajar Menambahkan Audio</h1>

    <h2>Putar Musik</h2>

    <audio controls>

        <source src="musik.mp3" type="audio/mpeg">

        Browser Anda tidak mendukung audio HTML.

    </audio>

    <p>Silakan tekan tombol play untuk memutar audio.</p>

</body>
</html>
