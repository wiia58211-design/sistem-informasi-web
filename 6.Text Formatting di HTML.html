<!DOCTYPE html>
<html>
<head>
    <title>Text Formatting HTML</title>
</head>
<body>

    <h1>Belajar Text Formatting</h1>

    <p><b>Ini adalah teks tebal.</b></p>

    <p><strong>Ini adalah teks penting.</strong></p>

    <p><i>Ini adalah teks miring.</i></p>

    <p><em>Ini adalah teks penekanan.</em></p>

    <p><u>Ini adalah teks bergaris bawah.</u></p>

    <p><mark>Ini adalah teks yang ditandai.</mark></p>

    <p><del>Ini adalah teks yang dicoret.</del></p>

    <p><small>Ini adalah teks kecil.</small></p>

    <p>Rumus air adalah H<sub>2</sub>O.</p>

    <p>Contoh pangkat: 2<sup>3</sup> = 8.</p>

</body>
</html>
